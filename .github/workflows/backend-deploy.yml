name: Build and Deploy Backend to AWS EC2 (PM2)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Cloud Build & EC2 Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install All Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Build Backend (Compile TypeScript)
        working-directory: backend
        run: npm run build

      - name: Prune devDependencies for Production
        working-directory: backend
        run: npm prune --omit=dev

      - name: Package Deployment Bundle
        working-directory: backend
        run: |
          tar -czf deploy.tar.gz dist node_modules prisma package.json prisma.config.ts

      - name: Transfer Deployment Bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: 'backend/deploy.tar.gz'
          target: '/home/${{ secrets.EC2_USERNAME }}/app'
          strip_components: 1

      - name: Extract Bundle and Restart App via PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            APP_DIR="/home/${{ secrets.EC2_USERNAME }}/app"
            cd "$APP_DIR"
            
            echo "=================================================="
            echo " Deploying Backend Artifact on AWS EC2..."
            echo "=================================================="
            
            # Extract artifact
            echo "==> Unpacking deployment artifact..."
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz
            
            # Run database migrations
            if [ -f .env ]; then
              echo "==> Running Prisma database migrations..."
              npx prisma migrate deploy || true
            else
              echo "WARNING: .env not found in $APP_DIR. Skipping migration check."
            fi
            
            # Reload application in PM2 (zero-downtime)
            echo "==> Reloading backend process via PM2..."
            pm2 reload kk-backend || pm2 start dist/main.js --name kk-backend
            pm2 save
            
            echo "=================================================="
            echo " Backend Successfully Deployed and Healthy!"
            echo "=================================================="
