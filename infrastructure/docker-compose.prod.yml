services:
  backend:
    image: ${BACKEND_IMAGE:-kk-backend:latest}
    container_name: kk-backend
    restart: unless-stopped
    ports:
      # Bind to 127.0.0.1:5000 so it is only accessible via Nginx/Caddy reverse proxy
      # Change to "5000:5000" if testing without a reverse proxy
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - NODE_OPTIONS=--no-experimental-require-module
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional automated reverse-proxy with SSL (Let's Encrypt)
